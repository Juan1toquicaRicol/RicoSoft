name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # `prisma generate` solo necesita poder leer el schema, no conectarse a
    # una base real; los tests tampoco hacen queries reales (ver
    # src/**/*.test.ts). Estos valores son placeholders únicamente para que
    # el pipeline no dependa de secretos configurados en el repositorio.
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=false"
      JWT_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
