name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # `prisma generate` solo necesita poder leer el schema, no conectarse a
    # una base real; los tests tampoco hacen queries reales (ver
    # src/**/*.test.ts). Estos valores son placeholders únicamente para que
    # el pipeline no dependa de secretos configurados en el repositorio.
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=false"
      JWT_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # GATE OBLIGATORIO. Corre la suite de integración contra una base SQL
  # Server REAL (contenedor de servicio efímero, destruido con el runner) para
  # probar aislamiento multi-tenant, índices únicos, transacciones y
  # concurrencia — lo que los tests con DATABASE_URL placeholder del job
  # "backend" nunca ejercitan.
  #
  # Bloqueante de dos maneras: (1) si falla, el job falla; (2) el paso
  # "Gate anti-omisión" falla si hubo 0 tests o CUALQUIER test omitido
  # (describe.skipIf(!RUN) dejaría todo en verde sin ejecutar nada).
  # Para que bloquee un PR, "CI gate" (job de abajo) debe estar marcado como
  # required status check en la protección de la rama main (ajuste del
  # repositorio en GitHub, no configurable desde este archivo).
  #
  # Estabilidad: se ejecuta con --maxWorkers=1 --no-file-parallelism
  # (test:integration:ci): un solo archivo a la vez, para evitar los
  # deadlocks/write conflicts (P2034/P2028) de SQL Server por contención.
  backend-integration:
    name: Backend integration (SQL Server real, bloqueante)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_INTEGRATION_MSSQL_PASSWORD || 'Ci_Integration_Test_2026!' }}
        ports:
          - 1433:1433
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.CI_INTEGRATION_MSSQL_PASSWORD || 'Ci_Integration_Test_2026!' }}
      MSSQL_INTEGRATION_DB: ricosoft_integration
      DATABASE_URL: "sqlserver://localhost:1433;database=ricosoft_integration;user=sa;password=${{ secrets.CI_INTEGRATION_MSSQL_PASSWORD || 'Ci_Integration_Test_2026!' }};encrypt=true;trustServerCertificate=true"
      JWT_SECRET: "ci-integration-secret-solo-para-pruebas-efimeras"
      RUN_DB_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Preparar base de datos de integración (reintenta hasta que SQL Server esté listo)
        run: npm run ci:preparar-db-integracion
      - run: npx prisma generate
      - name: Aplicar migraciones reales contra la base efímera
        run: npx prisma migrate deploy
      - name: Sincronizar catálogos generales para las pruebas
        run: npm run catalogos:sincronizar
      - name: Suite de integración (secuencial, --maxWorkers=1)
        run: npm run test:integration:ci
      - name: Gate anti-omisión (0 tests u omitidos = fallo)
        if: ${{ !cancelled() }}
        run: npm run test:integration:gate

  # Punto ÚNICO a exigir como required status check en main. Falla si
  # cualquiera de los jobs no terminó en "success" — incluido "skipped" o
  # "cancelled" (por eso if: always()): un job omitido no cuenta como verde.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [frontend, backend, backend-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos los jobs obligatorios fueron success
        run: |
          echo "frontend=${{ needs.frontend.result }} backend=${{ needs.backend.result }} backend-integration=${{ needs.backend-integration.result }}"
          [ "${{ needs.frontend.result }}" = "success" ] || exit 1
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          [ "${{ needs.backend-integration.result }}" = "success" ] || exit 1
