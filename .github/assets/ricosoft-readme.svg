<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title">
  <title id="title">RicoSoft Enterprise · Grupo Ricol</title>
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#11171e"/>
      <stop offset="1" stop-color="#202c39"/>
